name: Update EGX Report

on:
  schedule:
    # Every 30 min during EGX sessions (Sun-Thu, 7 AM - 5 PM UK time / BST)
    # BST = UTC+1, so 7AM BST = 6AM UTC, 5PM BST = 4PM UTC
    - cron: '0,30 6-16 * * 0-4'
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests setuptools websocket-client pandas numpy plotly
          pip install git+https://github.com/rongardF/tvdatafeed.git

      - name: Run analysis
        run: python analyze.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html data.json
          git diff --staged --quiet || git commit -m "Update EGX report $(date +\%Y-\%m-\%d)"
          git pull --rebase origin main
          git push
